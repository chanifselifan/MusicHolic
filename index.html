<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Holic</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">HM</div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-icon activ" data-page="home" title="Home"
            ><img src="/assets/home.png" alt=""
          /></a>
          <a
            href="#"
            class="nav-icon"
            data-page="foryou"
            title="Search / For You"
            ><img src="/assets/cari.png" alt=""
          /></a>
          <a href="#" class="nav-icon" data-page="favorites" title="Favorites"
            ><img src="/assets/love.png" alt=""
          /></a>
        </nav>

        <a href="#" class="sidebar-avatar" data-page="profile" title="Profile">
          <img src="/assets/bhapp.png" alt="profile" />
        </a>
      </aside>
      <main class="content">
        <header class="topbar">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Search"
          />
          <h1 class="page-title" id="pageTitle">summer routine playlist.</h1>
        </header>
        <div class="genre-music">
          <div class="pop">
            <img src="./assets/pop.png" alt="" /><h2 class="genre-label">pop</h2>
          </div>
          <div class="rock">
            <img src="./assets/rock.png" alt="" /><h2 class="genre-label">rock</h2>
          </div>
          <div class="jazz">
            <img src="./assets/jazz.png" alt="" /><h2 class="genre-label">jazz</h2>
          </div>
          <div class="retro">
            <img src="./assets/retro.png" alt="" /><h2 class="genre-label">retro</h2>
          </div>
          <div class="slow">
            <img src="./assets/slow.png" alt="" /><h2 class="genre-label">slow</h2>
          </div>
          <div class="alter-rock">
            <img src="./assets/alter-rock.png" alt="" /><h2 class="genre-label">alter rock</h2>
          </div>
          <div class="raindy">
            <img src="./assets/raindy.png" alt="" /><h2 class="genre-label">raindy</h2>
          </div>
          <div class="summer">
            <img src="./assets/summer.png" alt="" /><h2 class="genre-label">summer</h2>
          </div>
          <div class="campursari">
            <img src="./assets/campursari.png" alt="" /><h2 class="genre-label">campursari</h2>
          </div>
          <div class="bhapp">
            <img src="./assets/bhapp.png" alt="" /><h2 class="genre-label">bhapp</h2>
          </div>
        </div>
      </main>
    </div>

    <footer class="player-bar">
      <div class="now-playing">
        <img
          src="./assets/rock.png"
          alt="cover"
          class="cover-mini"
          id="nowPlayingCover"
        />
        <div class="song-info">
          <span class="song-title" id="nowPlayingTitle">thunder song</span>
          <span class="song-artist" id="nowPlayingArtist">thunder 1975</span>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button class="ctrl-btn" id="btnMute">
            <img src="./assets/Group (12).png" alt="" />
          </button>
          <button class="ctrl-btn" id="btnPrev">
            <img src="./assets/Repeat.png" alt="" />
          </button>
          <button class="ctrl-btn play" id="btnPlay">
            <img src="./assets/Play.png" alt="" />
          </button>
          <button class="ctrl-btn" id="btnNext">
            <img src="./assets/Fast Fwd.png" alt="" />
          </button>
          <button class="ctrl-btn" id="btnVolume">
            <img src="./assets/Volume Up.png" alt="" />
          </button>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="player-extra">
        <button class="ctrl-btn" id="btnLoveNow">
          <img src="./assets/love 5.png" alt="" />
        </button>
        <button class="ctrl-btn" id="btnRepeat">
          <img src="./assets/Repeat.png" alt="" />
        </button>
        <button class="ctrl-btn" id="btnShuffle" >
          <img src="./assets/Shuffle.png" alt="" />
        </button>
      </div>
    </footer>
  </body>
</html>
